    <script>
        const imagen = new Image();
        imagen.src = document.getElementById("imagenFondo").style.backgroundImage

        imagen.onload = function () {
            const aspectRatio = imagen.naturalWidth / imagen.naturalHeight;
            document.getElementById("imagenFondo").style.aspectRatio = aspectRatio;
        };
    </script>
